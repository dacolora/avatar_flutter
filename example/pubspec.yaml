name: avatar_flutter_example
description: App de ejemplo para el widget avatar_flutter.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  avatar_flutter:
    path: ../
  shared_preferences: ^2.3.2
  home_widget: ^0.7.0
  path_provider: ^2.1.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # SVG de la categoria "Insignia" que se usa en la galeria de
    # personalizacion (customization_gallery.dart) para demostrar que un
    # canal puede agregar su propia categoria con su propio arte, empaquetado
    # en su propia app en vez de en avatar_flutter — ver
    # AvatarOption.assetPackage.
    - assets/badge/
